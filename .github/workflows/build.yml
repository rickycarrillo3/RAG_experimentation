# Build the deployment image (API + web UI) and prove it builds.
#
# Be clear-eyed about what this buys. There is no test suite in this repo — test_chat.py
# is a manual smoke test, not pytest — so this workflow is not catching logic bugs. What
# it is for is that the IMAGE is now the deployment artifact (docker/Dockerfile.gpu is
# SETUP.md §1 executed at build time), and an artifact nobody builds automatically is one
# that quietly stops building. In particular the torch/torchvision CUDA pairing check in
# Dockerfile.gpu only protects anything if a build actually runs it.
#
# The images are also the first real verification of that Dockerfile: it was authored on
# a Mac with no Docker daemon, so CI is where it first gets built at all.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONTEXT: knowledge-base-math

jobs:
  compile:
    name: byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Cheapest possible catch for a syntax error or a bad f-string reaching main.
      # Excludes venv/, which is gitignored but may exist in a local run of `act`.
      - run: python -m compileall -q -x 'venv|__pycache__|node_modules' ${{ env.CONTEXT }}

  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CONTEXT }}/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.CONTEXT }}/web/package-lock.json
      # Cheap and fast compared with the GPU image, which also builds the UI — this is
      # the job that names a TS error in seconds instead of after a CUDA layer.
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  gpu-image:
    name: app image (GPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA base plus a cu128 torch/torchvision pair and marker-pdf runs to several
      # GB, and a GitHub-hosted runner ships with ~14GB free. Reclaim the preinstalled
      # toolchains we do not use before building, or the build fails on ENOSPC partway
      # through pip — which looks like a dependency problem and is not one.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/kbm-gpu

      # No `load:` on PRs here — the image is too large to be worth materialising in the
      # daemon just to import it. The build itself is the test: Dockerfile.gpu runs
      # `from torchvision.ops import nms` and `pip check` as build steps, which is the
      # documented failure this image exists to make impossible.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/docker/Dockerfile.gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu
